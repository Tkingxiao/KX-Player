[package]
name = "kx-player"
version = "2.0.0"
description = "KX音乐播放器 - 本地 ASMR 音视频播放器（Tauri 版）"
authors = ["Kingxiao"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "kx_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [
  "tray-icon",
  "protocol-asset",
  "image-png",
  "common-controls-v6",
] }
tauri-plugin-dialog = "2.7"
tauri-plugin-single-instance = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "fs", "sync", "process", "time", "macros"] }
rusqlite = { version = "0.40", features = ["bundled"] }
lofty = "0.25"
walkdir = "2.5"
notify = "8"
image = "0.25"
encoding_rs = "0.8"
thiserror = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
base64 = "0.22"
blake3 = "1"
uuid = { version = "1", features = ["v5"] }
once_cell = "1"
libmpv2 = "6.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "native-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
] }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
